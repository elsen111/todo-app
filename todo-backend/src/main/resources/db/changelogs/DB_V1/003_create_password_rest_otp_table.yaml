
databaseChangeLog:
  - changeSet:
      id: 003_create_password_reset_otp_table
      author: elsen111
      comment: Create password reset OTP table
      changes:
        - createTable:
            tableName: password_reset_otps
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_user
                    references: users(id)
                    deleteCascade: true

              - column:
                  name: otp_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: verified_at
                  type: TIMESTAMP

              - column:
                  name: used_at
                  type: TIMESTAMP

              - column:
                  name: reset_token_hash
                  type: VARCHAR(64)

              - column:
                  name: reset_token_expires_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: invalidated_at
                  type: TIMESTAMP

              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            sql: >
              ALTER TABLE password_reset_otps
              ADD CONSTRAINT chk_password_reset_attempts
              CHECK (attempts >= 0);

        - createIndex:
            tableName: password_reset_otps
            indexName: idx_password_reset_user_created
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
