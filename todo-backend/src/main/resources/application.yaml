  spring:
    application:
      name: todo-backend

    profiles:
      default: dev

    liquibase:
      enabled: true
      change-log: classpath:db/db.changelog-master.yaml
      default-schema: public

    jpa:
      open-in-view: false

  server:
    port: ${SERVER_PORT:8080}

  app:
    frontend:
      url: ${FRONTEND_URL:http://localhost:5173}

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
      allow-credentials: true
      max-age: 3600

    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

    mail:
      from: ${MAIL_FROM:no-reply@example.com}

    rate-limit:
      enabled: true
      capacity: ${RATE_LIMIT_CAPACITY:100}
      refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
      refill-duration: ${RATE_LIMIT_REFILL_DURATION:1m}

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
      tags-sorter: alpha
      display-request-duration: true
