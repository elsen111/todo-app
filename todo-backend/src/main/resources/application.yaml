
spring:
  application:
    name: todo-backend

  profiles:
    default: dev

  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.yaml
    default-schema: public

  jpa:
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  password-reset:
    otp-expiration: 5m
    resend-cooldown: 60s
    reset-token-expiration: 10m
    max-attempts: 5
    otp-length: 6
    otp-secret: ${PASSWORD_RESET_OTP_SECRET}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
    allow-credentials: true
    max-age: 3600

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

  rate-limit:
    auth:
      capacity: 5
      refill-duration-minutes: 1

    general:
      capacity: 100
      refill-duration-minutes: 1

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
