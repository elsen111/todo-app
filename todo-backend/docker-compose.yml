services:
  postgres:
    image: postgres:17-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d todo_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: todo-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025

  app:
    build: .
    container_name: todo-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file: .env
    environment:
      # These override the localhost values in .env, which don't work inside Docker
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/todo_db
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data: